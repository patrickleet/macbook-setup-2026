# =============================================================================
# mise.toml — Declarative dev tools config
# Symlinked to ~/.config/mise/config.toml by init.sh
# =============================================================================

[settings]
auto_install = true

# =============================================================================
# Dev tool runtimes
# =============================================================================
[tools]
pnpm = "11.18.0"
# Keep Node on the LTS line while letting Renovate update the exact release.
node = "24.18.1"
python = "3.14.6"
rust = "1.97.1"
go = "1.26.5"

# =============================================================================
# CLI tools from mise registry
# =============================================================================
jq = "1.8.2"
kubectl = "1.36.3"
helm = "4.2.3"
"aqua:txn2/kubefwd" = "1.25.16"
lima = "2.2.0"
colima = "0.10.3"
docker-cli = "29.6.2"
docker-compose = "5.3.1"
yq = "4.53.3"
sops = "3.13.3"
aws-cli = "2.36.21"
gh = "2.96.0"
opencode = "1.18.10"
op = "2.38.1"
stripe-cli = "1.44.1"
flyctl = "0.4.77"
pipx = "1.16.5"
"pipx:gimme-aws-creds" = "2.8.2"
"pipx:git-filter-repo" = "2.47.0"

# =============================================================================
# Go-installed CLI tools
# =============================================================================
"go:github.com/cloudflare/cloudflare-go/cmd/flarectl" = "0.117.0"

# =============================================================================
# npm global tools
# =============================================================================
"npm:typescript" = "7.0.2"
"npm:@openai/codex" = "0.146.0"
"npm:@xai-official/grok" = { version = "1.0.0", npm_args = "--ignore-scripts=false --allow-scripts=@xai-official/grok" }

# =============================================================================
# Tools installed from GitHub releases
# =============================================================================
"github:charmbracelet/glow" = "2.1.2"
# atc and git-kb are installed through Cargo while under active development.
# renovate: datasource=github-tags depName=gitkb/atc versioning=semver-coerced
# "github:gitkb/atc" = "0.1.8"
"github:hops-ops/hops-cli" = { version = "0.37.1", rename_exe = "hops" }
"github:hops-ops/distributed" = { version = "3.3.4", minimum_release_age = "0s" }
"github:knative/client" = "knative-v1.23.0"
"github:nkzw-tech/codiff" = "1.9.2"
"github:unbounded-tech/vnext" = "1.16.3"
"github:harmony-labs/meta" = "0.2.22"
terraform = "1.15.8"
actionlint = "1.7.12"

[tools."http:up"]
version = "v0.53.0"

[tools."http:up".platforms]
linux-x64 = { url = "https://cli.upbound.io/stable/{{version}}/bin/linux_amd64/up", bin = "up" }
linux-arm64 = { url = "https://cli.upbound.io/stable/{{version}}/bin/linux_arm64/up", bin = "up" }
macos-x64 = { url = "https://cli.upbound.io/stable/{{version}}/bin/darwin_amd64/up", bin = "up" }
macos-arm64 = { url = "https://cli.upbound.io/stable/{{version}}/bin/darwin_arm64/up", bin = "up" }

# Crossplane's CLI is published from its own GitHub releases repository.
# renovate: datasource=github-releases depName=crossplane/cli versioning=semver
[tools."http:crossplane"]
version = "v2.4.1"

[tools."http:crossplane".platforms]
linux-x64 = { url = "https://cli.crossplane.io/stable/{{version}}/bin/linux_amd64/crossplane", bin = "crossplane" }
linux-arm64 = { url = "https://cli.crossplane.io/stable/{{version}}/bin/linux_arm64/crossplane", bin = "crossplane" }
macos-x64 = { url = "https://cli.crossplane.io/stable/{{version}}/bin/darwin_amd64/crossplane", bin = "crossplane" }
macos-arm64 = { url = "https://cli.crossplane.io/stable/{{version}}/bin/darwin_arm64/crossplane", bin = "crossplane" }

# [tools."github:gitkb/gitkb-releases"]
# version = "0.2.14"
#
# [tools."github:gitkb/gitkb-releases".platforms]
